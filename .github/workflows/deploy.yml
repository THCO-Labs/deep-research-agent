name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: cae637758ca2acr.azurecr.io
          username: cae637758ca2acr
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: cae637758ca2acr.azurecr.io/deep-research-agent:${{ github.sha }},cae637758ca2acr.azurecr.io/deep-research-agent:latest

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: cae637758ca2acr
          containerAppName: app-drbench-api
          resourceGroup: rg-deepresearch-bench
          imageToDeploy: cae637758ca2acr.azurecr.io/deep-research-agent:${{ github.sha }}
          targetPort: 8080
          environmentVariables: RUNS_DIR=/app/runs
