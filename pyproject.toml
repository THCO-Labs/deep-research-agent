[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Benchmark-grade public-web deep research agent with citation verification and evals."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "deepagents>=0.6.4",
    "fake-useragent>=2.2.0",
    "google-genai>=1.53.0",
    "goose3>=3.1.21",
    "ddgs>=9.14.4",
    "httpx>=0.28.0",
    "langchain>=1.3.2",
    "langchain-google-genai>=4.2.3",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=0.2.0",
    "langchain-mistralai>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-experimental>=0.4.2",
    "langgraph>=1.0.0",
    "html5lib>=1.1",
    "lxml>=5.0.0",
    "markdownify>=1.2.2",
    "openpyxl>=3.1.0",
    "playwright>=1.59.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "azure-storage-queue>=12.12.0",
    "readability-lxml>=0.8.1",
    "regex>=2024.0.0",
    "scikit-learn>=1.4.0",
    "selectolax>=0.4.0",
    "newspaper4k>=0.9.5",
    "inscriptis>=2.3.2",
    "jusText>=3.0.2",
    "jieba>=0.42.1",
    "trafilatura>=2.0.0",
    "tavily-python>=0.7.24",
    "tldextract>=5.1.0",
    "yake>=0.7.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
huggingface = [
    "datasets>=5.0.0",
    "langchain-huggingface>=0.3.0",
    "huggingface-hub>=0.23.0",
    "pyarrow>=16.0.0",
]

[project.scripts]
deep-research = "deep_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["deep_research*"]

